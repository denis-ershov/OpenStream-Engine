name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Slim Twitch build
        run: cargo build -p streamproxyd --no-default-features --features slim-twitch

  # Проверка того, что генерируемые конфигурации действительно принимаются
  # ядром. Юнит-тесты проверяют лишь наличие подстрок, поэтому пропустили
  # правила с `redirect` в filter-цепочке и `reject` в prerouting: файл не
  # загружался целиком, а ошибка глушилась `2>/dev/null`.
  nft-syntax:
    name: nftables syntax (real parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      # nft -c требует CAP_NET_ADMIN; в непривилегированном user namespace
      # тест выполняется без root-прав на раннере.
      - name: Validate generated ruleset
        run: unshare -rn sh scripts/check-nft-syntax.sh

  # Проверка ucode-скриптов ИСПОЛНЕНИЕМ, а не только компиляцией: `ucode -c`
  # не выявляет импорт несуществующих символов и часть ошибок в регексах.
  ucode-check:
    name: ucode scripts (compile + execute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ucode
        run: |
          sudo apt-get update
          sudo apt-get install -y ucode || {
            echo "ucode отсутствует в репозиториях — проверка пропущена"
            exit 0
          }
      - name: Validate ucode scripts
        run: sh scripts/check-ucode.sh

  musl-aarch64:
    name: release aarch64-musl
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: goto-bus-stop/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build streamproxyd (size profile)
        run: cargo zigbuild --release -p streamproxyd --target aarch64-unknown-linux-musl
      - name: Size report
        run: ls -lh target/aarch64-unknown-linux-musl/release/streamproxyd
      - uses: actions/upload-artifact@v4
        with:
          name: streamproxyd-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/streamproxyd

  musl-armv7:
    name: release armv7-musleabihf
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: goto-bus-stop/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Cross build via cargo-zigbuild
        run: cargo zigbuild --release -p streamproxyd --target armv7-unknown-linux-musleabihf
      - name: Size report
        run: ls -lh target/armv7-unknown-linux-musleabihf/release/streamproxyd || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: streamproxyd-armv7-musleabihf
          path: target/armv7-unknown-linux-musleabihf/release/streamproxyd

listen: "0.0.0.0:18080"
# Playlist Edge (без CA). MITM: mode=transparent + mitm=true + CA на клиентах.
mode: edge
cache_ttl_secs: 2
max_manifest_bytes: 2097152
nft_file: "/usr/share/openstream/nft/openstream.nft"
hostlist_file: "/var/run/openstream/hostlist-effective.txt"
hostlist_refresh_secs: 300
hostlist_services:
  - twitch
custom_domains: []
hostlist_remote: false
hostlist_remote_base: "https://raw.githubusercontent.com/denis-ershov/OpenStream-Engine/main/package/openwrt/files/hostlists"
hostlist_remote_interval_hours: 12
mitm: false
prefetch_policy: strip_when_ads_removed
# proxy_public_url: "http://192.168.1.1:18080"

twitch:
  enabled: true
  detect_stitched: true
  detect_daterange: true
  detect_regex: false
  max_wait_secs: 30
  debug: false
  backup_seamless: false

kick:
  enabled: false
  debug: false

trovo:
  enabled: false
  debug: false

youtube:
  enabled: false
  debug: false

dash:
  enabled: true
  debug: false

observability:
  metrics: true
  events: true
  event_capacity: 128

tls:
  ca_cert: "/etc/openstream/ca.crt"
  ca_key: "/etc/openstream/ca.key"

# OpenStream Engine — статический dnsmasq конфиг.
# Содержит только безопасные address= правила (DNS sinkhole).
# Правила nftset/ipset генерируются динамически в /tmp/dnsmasq.d/openstream.conf
# только когда пакет активен, чтобы не ломать dnsmasq при выключенном OpenStream.

# Блокировка баннеров и рекламных трекеров Twitch (безопасно без зависимостей)
address=/edge.ads.twitch.tv/0.0.0.0
address=/edge.ads.twitch.tv/::

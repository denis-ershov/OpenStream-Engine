[package]
name = "openstream-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI toolkit for OpenStream 2.0 .osrule manifest linting, signing, and index generation"

[[bin]]
name = "osrule"
path = "src/main.rs"

[dependencies]
openstream-rule = { path = "../openstream-rule" }
openstream-core = { path = "../openstream-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
colored = "2.1"
anyhow = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]

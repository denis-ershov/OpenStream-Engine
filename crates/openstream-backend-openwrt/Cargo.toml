description = "OpenWrt network adapter and config translator (dnsmasq & nftables) for OpenStream Engine"

[dependencies]
openstream-core = { path = "../openstream-core" }
openstream-rule = { path = "../openstream-rule" }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]

[package]
name = "openstream-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core policy routing engine and domain/IP matchers for OpenStream Engine"

[dependencies]
openstream-rule = { path = "../openstream-rule" }
thiserror = "2.0"
bitflags = "2.4"
ipnet = "2.9"
parking_lot = "0.12"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rand = "0.8"

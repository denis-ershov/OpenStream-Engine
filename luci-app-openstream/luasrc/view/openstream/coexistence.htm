<%+header%>
<h2 name="content"><%:OpenStream Engine%> — <%:Environment%></h2>
<p><%:Default: Playlist Edge (GET /twitch/CHANNEL on :18080, no client CA). Segments from CDN. Neighbors (zapret, podkop/netshift/forkop, SSClash, ByeDPI) handle egress. Transparent MITM is optional and needs CA.%></p>
<div id="ose-env"><p><%:Loading…%></p></div>
<script type="text/javascript">
async function oseEnv() {
	try {
		const r = await fetch('<%=url("admin/services/openstream/api_status")%>');
		const j = await r.json();
		let html = '<p><strong><%:Coexistence%></strong>: ' +
			(j.coexistence_ok ? '<%:OK%>' : '<%:Check neighbors / prefer edge mode%>') + '</p><ul>';
		(j.neighbors||[]).forEach(n => {
			html += '<li>' + n.name + ': ' + (n.detected ? '<%:detected%>' : '<%:not found%>') +
				' — ' + (n.hint||'') + '</li>';
		});
		html += '</ul><p><%:Mode hint%>: ' + (j.mode_hint||'edge') + '</p>';
		document.getElementById('ose-env').innerHTML = html;
	} catch (e) {
		document.getElementById('ose-env').innerHTML = '<p><%:Daemon unreachable%> — <%:check%>: logread -e streamproxyd; /etc/init.d/streamproxyd restart</p>';
	}
}
oseEnv();
</script>
<%+footer%>
